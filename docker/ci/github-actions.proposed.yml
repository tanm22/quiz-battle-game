name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Boot mongo as a single-node replica set so transactions work.
      # GitHub Actions service-containers can't pass --replSet args cleanly,
      # so we run mongo as a sidecar container with explicit init.
      - name: Start mongo (rs0)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          # Wait for mongo to accept connections, then initiate rs0.
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            'try { rs.status() } catch(e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"localhost:27017"}]}) }'
          # Wait for primary election.
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$'; then break; fi
            sleep 1
          done
      - run: go mod download
      - run: make vet
      - run: make lint
      - run: make test
        env:
          # directConnection=true lets the driver target the single rs member without SRV discovery.
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
      - run: cd flutter && flutter pub get
      - run: cd flutter && flutter analyze
      - run: cd flutter && flutter test
