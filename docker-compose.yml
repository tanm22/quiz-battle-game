services:
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # We deliberately do NOT use /docker-entrypoint-initdb.d for rs.initiate:
    # the entrypoint runs that script before docker-compose DNS has wired
    # the `mongo` alias, so isSelf-checks fail. The healthcheck below
    # initiates idempotently once mongod is fully listening on the network,
    # and serves as a self-heal for volumes that pre-date this change.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet --eval '
            try { rs.status() } catch (e) {
              rs.initiate({_id:"rs0", members:[{_id:0, host:"mongo:27017"}]});
            }
            db.hello().isWritablePrimary
          ' | tail -n1 | grep -q true
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  seed:
    build: .
    command: sh -c "cd /data && seed"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0

  matchmaking:
    build: .
    command: matchmaking
    ports:
      - "50051:50051"
      - "21251:2112" # /metrics
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (export it or add to .env) — see README env-vars table}

  quiz:
    build: .
    command: quiz
    ports:
      - "50052:50052"
      - "21252:2112" # /metrics
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (export it or add to .env) — see README env-vars table}

  scoring:
    build: .
    command: scoring
    ports:
      - "50053:50053"
      - "21253:2112" # /metrics
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (export it or add to .env) — see README env-vars table}

  auth:
    build: .
    command: auth
    ports:
      - "50054:50054"
      - "21254:2112" # /metrics
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (export it or add to .env) — see README env-vars table}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}

  payment:
    build: .
    command: payment
    ports:
      - "50055:50055"
      - "8080:8080"
      - "21255:2112" # /metrics
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (export it or add to .env) — see README env-vars table}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}

  notification:
    build: .
    command: notification
    ports:
      - "21256:2112" # /metrics
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      # §4.6 policy gate: Redis backs the daily cap, dedup window, and
      # per-day metric counters. Without a reachable Redis the service
      # logs a warning and falls back to dispatching unfiltered.
      - REDIS_ADDR=redis:6379
      # Firebase Admin SDK auto-discovers credentials at this path via ADC.
      # Drop a real service-account JSON into ./secrets/firebase-admin.json
      # (download from Firebase Console → Service accounts → Generate key —
      # see secrets/README.md). The file is gitignored; the committed
      # firebase-admin.example.json is a reference template.
      # If the real file is absent, firebase.NewApp fails and the worker
      # falls back to stub mode (logs only, no FCM traffic).
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-admin.json
      # FIREBASE_PROJECT_ID is only needed if the service-account JSON lacks
      # a project_id field. The notification service passes it through to
      # firebase.NewApp when set.
      - FIREBASE_PROJECT_ID=quiz-battle-app-fd09b
    volumes:
      - ./secrets:/run/secrets:ro

  # §4.10 admin dashboard. Operator-facing HTTP service that surfaces
  # live state from Mongo + Redis + RabbitMQ on a single page. Read-
  # only — never publishes events, never writes Mongo. Kept on its own
  # binary so a stuck probe doesn't affect any user-facing service.
  admin:
    build: .
    command: admin
    ports:
      - "8090:8090" # dashboard + /api/stats
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest

volumes:
  redis_data:
  rabbitmq_data:
  mongo_data:
