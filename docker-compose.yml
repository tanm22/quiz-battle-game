services:
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/replset-init.js:/docker-entrypoint-initdb.d/replset-init.js:ro
    healthcheck:
      # The healthcheck doubles as the rs0 initiator: idempotent rs.initiate()
      # if status throws, otherwise just a pingable status. Once primary, we
      # report healthy.
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed:
    build: .
    command: sh -c "cd /data && seed"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0

  matchmaking:
    build: .
    command: matchmaking
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=change-me-in-production

  quiz:
    build: .
    command: quiz
    ports:
      - "50052:50052"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=change-me-in-production

  scoring:
    build: .
    command: scoring
    ports:
      - "50053:50053"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=change-me-in-production

  auth:
    build: .
    command: auth
    ports:
      - "50054:50054"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=change-me-in-production
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}

  payment:
    build: .
    command: payment
    ports:
      - "50055:50055"
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      - JWT_SECRET=change-me-in-production
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}

  notification:
    build: .
    command: notification
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MONGO_URI=mongodb://mongo:27017/quizbattle?replicaSet=rs0
      # Firebase Admin SDK auto-discovers credentials at this path via ADC.
      # Drop a real service-account JSON into ./secrets/firebase-admin.json
      # (download from Firebase Console → Service accounts → Generate key —
      # see secrets/README.md). The file is gitignored; the committed
      # firebase-admin.example.json is a reference template.
      # If the real file is absent, firebase.NewApp fails and the worker
      # falls back to stub mode (logs only, no FCM traffic).
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-admin.json
      # FIREBASE_PROJECT_ID is only needed if the service-account JSON lacks
      # a project_id field. The notification service passes it through to
      # firebase.NewApp when set.
      - FIREBASE_PROJECT_ID=quiz-battle-app-fd09b
    volumes:
      - ./secrets:/run/secrets:ro

volumes:
  redis_data:
  rabbitmq_data:
  mongo_data:
