syntax = "proto3";

package quiz;

option go_package = "quiz-battle/proto";

// ---------------------------------------------------------------------------
// MatchmakingService
// ---------------------------------------------------------------------------

service MatchmakingService {
  rpc JoinMatchmaking(JoinMatchmakingRequest) returns (JoinMatchmakingResponse);
  rpc LeaveMatchmaking(LeaveMatchmakingRequest) returns (LeaveMatchmakingResponse);
  rpc SubscribeToMatch(SubscribeToMatchRequest) returns (stream MatchEvent);
}

message JoinMatchmakingRequest {
  string user_id = 1;
  int32  rating  = 2;
}

message JoinMatchmakingResponse {
  MatchmakingStatus status = 1;
}

enum MatchmakingStatus {
  QUEUED           = 0;
  ALREADY_IN_QUEUE = 1;
}

message LeaveMatchmakingRequest {
  string user_id = 1;
}

message LeaveMatchmakingResponse {
  bool removed = 1;
}

message SubscribeToMatchRequest {
  string user_id         = 1;
  int64  sequence_number = 2;
}

message MatchEvent {
  string          room_id = 1;
  repeated string players = 2;
  int64           sequence_number = 3;
}

// ---------------------------------------------------------------------------
// QuizService
// ---------------------------------------------------------------------------

service QuizService {
  rpc GetRoomQuestions(GetRoomQuestionsRequest) returns (GetRoomQuestionsResponse);
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  rpc StreamGameEvents(StreamGameEventsRequest) returns (stream GameEvent);
  // Phase 2
  rpc GetTournamentList(GetTournamentListRequest) returns (GetTournamentListResponse);
  rpc JoinTournament(JoinTournamentRequest) returns (JoinTournamentResponse);
}

message GetRoomQuestionsRequest {
  string room_id = 1;
}

message GetRoomQuestionsResponse {
  repeated Question questions = 1;
}

message Question {
  string          id             = 1;
  string          text           = 2;
  repeated string options        = 3;
  string          difficulty     = 4;
  string          topic          = 5;
}

message SubmitAnswerRequest {
  string room_id          = 1;
  string user_id          = 2;
  int32  round            = 3;
  int32  option_index     = 4;
  int64  client_timestamp = 5;
}

message SubmitAnswerResponse {
  bool accepted = 1;
}

message StreamGameEventsRequest {
  string room_id         = 1;
  string user_id         = 2;
  int64  sequence_number = 3;
}

// ---------------------------------------------------------------------------
// GameEvent — oneof union streamed to Flutter clients
// ---------------------------------------------------------------------------

message GameEvent {
  int64 sequence_number = 7;

  oneof event {
    QuestionBroadcast  question    = 1;
    LeaderboardUpdate  leaderboard = 2;
    RoundResult        round_result = 3;
    MatchEnd           match_end   = 4;
    PlayerJoined       player_joined = 5;
    TimerSync          timer_sync  = 6;
  }
}

message QuestionBroadcast {
  string          question_id   = 1;
  string          text          = 2;
  repeated string options       = 3;
  int64           deadline_unix = 4;
  int32           round         = 5;
}

message LeaderboardUpdate {
  repeated LeaderboardEntry entries = 1;
}

message LeaderboardEntry {
  string user_id  = 1;
  string username = 2;
  double score    = 3;
  int32  rank     = 4;
  string plan     = 5; // "free" or "premium"
}

message RoundResult {
  int32 round         = 1;
  int32 correct_index = 2;
}

message MatchEnd {
  string                room_id  = 1;
  string                winner   = 2;
  repeated PlayerResult players  = 3;
  int32                 rounds   = 4;
  int64                 duration = 5;
}

message PlayerResult {
  string user_id              = 1;
  string username              = 2;
  double final_score           = 3;
  int32  rank                  = 4;
  int32  answers_correct       = 5;
  double avg_response_time_ms  = 6;
  string plan                  = 7; // "free" or "premium"
}

message PlayerJoined {
  string user_id  = 1;
  string username = 2;
  string plan     = 3; // "free" or "premium"
}

message TimerSync {
  int64 deadline_unix = 1;
}

// ---------------------------------------------------------------------------
// ScoringService
// ---------------------------------------------------------------------------

service ScoringService {
  rpc CalculateScore(CalculateScoreRequest) returns (CalculateScoreResponse);
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetMatchHistory(GetMatchHistoryRequest) returns (GetMatchHistoryResponse);
  // Phase 2: User Service RPCs (scoring service acts as user service)
  rpc GetHomeScreenData(GetHomeScreenDataRequest) returns (GetHomeScreenDataResponse);
  rpc GetReferralDashboard(GetReferralDashboardRequest) returns (GetReferralDashboardResponse);
  rpc ApplyReferralCode(ApplyReferralCodeRequest) returns (ApplyReferralCodeResponse);
  rpc UpdateFCMToken(UpdateFCMTokenRequest) returns (UpdateFCMTokenResponse);
  // Phase 3: Global leaderboard with time filters
  rpc GetGlobalLeaderboard(GetGlobalLeaderboardRequest) returns (GetGlobalLeaderboardResponse);
  // Phase 3 (4.3): Coins & Shop — balance read + ledger history.
  rpc GetCoinBalance(GetCoinBalanceRequest) returns (GetCoinBalanceResponse);
  rpc GetCoinLedger(GetCoinLedgerRequest) returns (GetCoinLedgerResponse);
  // Phase 3 (4.3) PR 4: shop catalog + inventory + spend.
  rpc GetShopCatalog(GetShopCatalogRequest) returns (GetShopCatalogResponse);
  rpc GetShopInventory(GetShopInventoryRequest) returns (GetShopInventoryResponse);
  rpc PurchaseShopItem(PurchaseShopItemRequest) returns (PurchaseShopItemResponse);
  // Phase 3 (4.3) PR 5: item effects.
  // EquipCosmetic activates an owned avatar frame or name color. Idempotent
  // — re-equipping the already-equipped item is a no-op success.
  rpc EquipCosmetic(EquipCosmeticRequest) returns (EquipCosmeticResponse);
  // ConsumeReroll atomically decrements rerollCharges by 1; returns the
  // post-decrement count so the caller can render "N left" without a
  // second read.
  rpc ConsumeReroll(ConsumeRerollRequest) returns (ConsumeRerollResponse);
  // Phase 3 (4.4): Friends & Challenges.
  // SendFriendRequest takes EXACTLY ONE of target_username / target_referral_code.
  // Idempotent on (fromUserId, toUserId): a duplicate send returns the
  // existing pending request or the existing accepted relationship.
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  // RespondToFriendRequest accepts or rejects a pending incoming request.
  // The caller must be the request's recipient; otherwise PERMISSION_DENIED.
  rpc RespondToFriendRequest(RespondToFriendRequestRequest) returns (RespondToFriendRequestResponse);
  // GetFriendsList returns accepted friendships for the caller, with each
  // friend's online flag derived from the Redis presence:{userId} TTL key.
  rpc GetFriendsList(GetFriendsListRequest) returns (GetFriendsListResponse);
  // GetFriendRequests returns pending incoming friend requests (the
  // outgoing direction is implicit from SendFriendRequest's response).
  rpc GetFriendRequests(GetFriendRequestsRequest) returns (GetFriendRequestsResponse);
  // Heartbeat refreshes the caller's presence TTL. Clients call this on
  // app foreground / every ~30s while open. No-op safe.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // ChallengeFriend creates a private 1v1 room with the caller and the
  // friend, publishes notif.friend.challenge, and returns the room id
  // both clients can use to enter the game flow. The friend must be in
  // the caller's accepted friends; otherwise NOT_FRIENDS error code.
  rpc ChallengeFriend(ChallengeFriendRequest) returns (ChallengeFriendResponse);
}

// ---------------------------------------------------------------------------
// AuthService
// ---------------------------------------------------------------------------

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse);
  rpc GuestLogin(GuestLoginRequest) returns (AuthResponse);
  rpc LoginWithEmail(EmailLoginRequest) returns (SendEmailCodeResponse);
  rpc SendEmailCode(SendEmailCodeRequest) returns (SendEmailCodeResponse);
  rpc VerifyEmailCode(VerifyEmailCodeRequest) returns (VerifyEmailCodeResponse);
  rpc LinkEmail(LinkEmailRequest) returns (LinkEmailResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc CheckUsername(CheckUsernameRequest) returns (CheckUsernameResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // Phase 2
  rpc GoogleSignIn(GoogleSignInRequest) returns (GoogleSignInResponse);
  rpc ClaimDailyReward(ClaimDailyRewardRequest) returns (ClaimDailyRewardResponse);
  rpc GetStreakInfo(GetStreakInfoRequest) returns (GetStreakInfoResponse);
  // Phase 3
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}

// ---------------------------------------------------------------------------
// PaymentService (Phase 2)
// ---------------------------------------------------------------------------

service PaymentService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetPlanStatus(GetPlanStatusRequest) returns (GetPlanStatusResponse);
  rpc GetPaymentHistory(GetPaymentHistoryRequest) returns (GetPaymentHistoryResponse);
}

message RegisterRequest {
  string username      = 1;
  string password      = 2;
  string email         = 3; // optional at registration
  string referral_code = 4; // optional referral code
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message AuthResponse {
  string user_id        = 1;
  string username       = 2;
  string token          = 3;
  int32  rating         = 4;
  int32  matches_played = 5;
  int32  wins           = 6;
  string email          = 7;
  bool   is_guest       = 8;
  string plan           = 9;
  int64  coins          = 10;
  StreakInfo streak      = 11;
  string referral_code  = 12;
  bool   streak_updated = 13;
  RewardGrant reward    = 14;
  bool   onboarding_completed = 15;
}

message GetProfileRequest {}

message ProfileResponse {
  string user_id        = 1;
  string username       = 2;
  int32  rating         = 3;
  int32  matches_played = 4;
  int32  wins           = 5;
  string email          = 6;
  bool   is_guest       = 7;
  string plan           = 8;
  int64  coins          = 9;
  StreakInfo streak      = 10;
  string referral_code  = 11;
  string          display_name         = 12;
  string          avatar_url           = 13;
  repeated string preferred_topics     = 14;
  bool            onboarding_completed = 15;
}

message GuestLoginRequest {}

message EmailLoginRequest {
  string email = 1;
}

message SendEmailCodeRequest {
  string email   = 1;
  string purpose = 2; // "login", "reset", "link"
}

message SendEmailCodeResponse {
  bool sent = 1;
}

message VerifyEmailCodeRequest {
  string email = 1;
  string code  = 2;
}

message VerifyEmailCodeResponse {
  bool   verified = 1;
  string token    = 2; // JWT returned for login flow
  string user_id  = 3;
}

message LinkEmailRequest {
  string email = 1;
  string code  = 2;
}

message LinkEmailResponse {
  bool linked = 1;
}

message ResetPasswordRequest {
  string email        = 1;
  string code         = 2;
  string new_password = 3;
}

message ResetPasswordResponse {
  bool success = 1;
}

message CheckUsernameRequest {
  string username = 1;
}

message CheckUsernameResponse {
  bool available = 1;
}

message DeleteAccountRequest {}

message DeleteAccountResponse {
  bool deleted = 1;
}

// Phase 3: Onboarding profile update
message UpdateProfileRequest {
  string          display_name         = 1;
  string          avatar_url           = 2;
  repeated string preferred_topics     = 3;
  bool            onboarding_completed = 4;
}

message UpdateProfileResponse {
  bool success = 1;
}

message CalculateScoreRequest {
  string room_id        = 1;
  string user_id        = 2;
  int32  round          = 3;
  int32  option_index   = 4;
  int64  answer_time_ms = 5;
}

message CalculateScoreResponse {
  double score            = 1;
  bool   correct          = 2;
  double speed_multiplier = 3;
}

message GetLeaderboardRequest {
  string room_id = 1;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}

message GetMatchHistoryRequest {
  int32 limit  = 1; // max results, default 20
  int32 offset = 2; // pagination offset
}

message GetMatchHistoryResponse {
  repeated MatchHistoryEntry matches = 1;
}

message MatchHistoryEntry {
  string                room_id    = 1;
  string                winner     = 2;
  repeated PlayerResult players    = 3;
  int32                 rounds     = 4;
  int64                 duration   = 5;
  int64                 created_at = 6;
}

// ---------------------------------------------------------------------------
// Phase 2: Shared types
// ---------------------------------------------------------------------------

message StreakInfo {
  int32  current           = 1;
  int32  longest           = 2;
  string last_claimed_date = 3; // YYYY-MM-DD in IST
}

message RewardGrant {
  int64  coins         = 1;
  string badge_name    = 2; // empty if no badge
  int32  bonus_quizzes = 3; // 0 if none
}

message PlanStatus {
  string plan       = 1; // "free" or "premium"
  int64  expires_at = 2; // unix timestamp, 0 if free
}

// ---------------------------------------------------------------------------
// Phase 2: Google Auth
// ---------------------------------------------------------------------------

message GoogleSignInRequest {
  string id_token      = 1;
  string referral_code = 2; // optional
}

message GoogleSignInResponse {
  string      token          = 1; // JWT
  UserProfile user_profile   = 2;
  bool        is_new_user    = 3;
  bool        streak_updated = 4;
  RewardGrant reward         = 5;
}

message UserProfile {
  string     user_id          = 1;
  string     username         = 2;
  string     display_name     = 3;
  string     email            = 4;
  string     avatar_url       = 5;
  int32      rating           = 6;
  int32      matches_played   = 7;
  int32      wins             = 8;
  string     plan             = 9;
  int64      coins            = 10;
  StreakInfo  streak           = 11;
  string     referral_code    = 12;
  bool       is_guest         = 13;
  float      accuracy_percent = 14; // lifetime accuracy: correct_answers / total_answers * 100
  int32      win_streak       = 15; // current consecutive wins
  repeated string preferred_topics     = 16;
  bool            onboarding_completed = 17;
}

// ---------------------------------------------------------------------------
// Phase 2: Streak + Daily Reward
// ---------------------------------------------------------------------------

message ClaimDailyRewardRequest {}

message ClaimDailyRewardResponse {
  RewardGrant reward = 1;
  StreakInfo   streak = 2;
}

message GetStreakInfoRequest {}

message GetStreakInfoResponse {
  StreakInfo streak = 1;
}

// ---------------------------------------------------------------------------
// Phase 2: Home Screen
// ---------------------------------------------------------------------------

message GetHomeScreenDataRequest {}

message GetHomeScreenDataResponse {
  UserProfile            profile              = 1;
  int32                  quota_remaining      = 2;
  int32                  quota_limit          = 3;
  repeated LeaderboardEntry leaderboard_preview = 4;
}

// ---------------------------------------------------------------------------
// Phase 2: Referral
// ---------------------------------------------------------------------------

message GetReferralDashboardRequest {}

message GetReferralDashboardResponse {
  string referral_code    = 1;
  int32  total_invites    = 2;
  int32  conversions      = 3;
  int64  coins_earned     = 4;
}

message ApplyReferralCodeRequest {
  string code = 1;
}

message ApplyReferralCodeResponse {
  bool success = 1;
}

// ---------------------------------------------------------------------------
// Phase 2: FCM Token
// ---------------------------------------------------------------------------

message UpdateFCMTokenRequest {
  string token = 1;
}

message UpdateFCMTokenResponse {
  bool success = 1;
}

// ---------------------------------------------------------------------------
// Phase 2: Payment
// ---------------------------------------------------------------------------

message CreateOrderRequest {
  string plan_duration = 1; // "monthly" or "yearly"
}

message CreateOrderResponse {
  string order_id = 1;
  string key_id   = 2;
  int64  amount   = 3; // in paise
  string currency = 4;
}

message GetPlanStatusRequest {}

message GetPlanStatusResponse {
  string plan       = 1;
  int64  expires_at = 2;
}

message GetPaymentHistoryRequest {
  int32 limit  = 1;
  int32 offset = 2;
}

message GetPaymentHistoryResponse {
  repeated PaymentRecord payments = 1;
}

message PaymentRecord {
  string order_id      = 1;
  int64  amount        = 2;
  string currency      = 3;
  string status        = 4; // "created", "captured", "failed"
  string plan_duration = 5;
  int64  created_at    = 6;
}

// ---------------------------------------------------------------------------
// Phase 2: Tournaments
// ---------------------------------------------------------------------------

message GetTournamentListRequest {}

message GetTournamentListResponse {
  repeated TournamentInfo tournaments = 1;
}

message TournamentInfo {
  string id                = 1;
  string name              = 2;
  int64  start_time        = 3;
  int64  end_time          = 4;
  string status            = 5; // "upcoming", "active", "completed"
  int32  participant_count = 6;
  string required_plan     = 7;
  string prize_description = 8;
}

message JoinTournamentRequest {
  string tournament_id = 1;
}

message JoinTournamentResponse {
  bool success = 1;
}

// ---------------------------------------------------------------------------
// Phase 3: Global Leaderboard
// ---------------------------------------------------------------------------

message GetGlobalLeaderboardRequest {
  string time_filter = 1; // "daily", "weekly", "alltime" (default)
}

message GetGlobalLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}

// ---------------------------------------------------------------------------
// Phase 3 (4.3): Coins & Shop — coin balance + ledger history
// ---------------------------------------------------------------------------

message GetCoinBalanceRequest {}

message GetCoinBalanceResponse {
  int64 balance = 1;
}

message CoinLedgerEntry {
  string id                = 1;
  int64  delta             = 2;
  string reason            = 3;
  string ref_id            = 4;
  int64  balance_after     = 5;
  int64  created_at_unix_ms = 6;
  map<string, string> metadata = 7;
}

message GetCoinLedgerRequest {
  int32  page_size  = 1;
  string page_token = 2;
}

message GetCoinLedgerResponse {
  repeated CoinLedgerEntry entries = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------
// Phase 3 (4.3) PR 4: Shop catalog, inventory, and purchase
// ---------------------------------------------------------------------------

message ShopItem {
  string id          = 1;
  string kind        = 2; // see pkg/coins/shop Kind* constants
  string name        = 3;
  string description = 4;
  int64  price_coins = 5;
  bool   active      = 6;
  map<string, string> metadata = 7;
}

message GetShopCatalogRequest {}

message GetShopCatalogResponse {
  repeated ShopItem items = 1;
}

message GetShopInventoryRequest {}

message GetShopInventoryResponse {
  repeated string owned_cosmetics       = 1;
  string          equipped_cosmetic_id  = 2;
  string          equipped_name_color   = 3;
  int32           reroll_charges        = 4;
  bool            streak_freeze_held    = 5;
  string          streak_freeze_week_iso = 6;
  int64           balance               = 7;
}

message PurchaseShopItemRequest {
  string item_id         = 1;
  string idempotency_key = 2;
}

message PurchaseShopItemResponse {
  bool   success         = 1;
  string ledger_entry_id = 2;
  int64  new_balance     = 3;
  // Empty on success. Domain error codes: INSUFFICIENT, INACTIVE, UNKNOWN,
  // WEEKLY_CAP. gRPC-level errors (Unauthenticated, InvalidArgument) come
  // back as status errors instead.
  string error_code      = 4;
}

// ---------------------------------------------------------------------------
// Phase 3 (4.3) PR 5: Item effects
// ---------------------------------------------------------------------------

message EquipCosmeticRequest {
  string item_id = 1;
}

message EquipCosmeticResponse {
  bool success = 1;
  // Empty on success. Domain error codes:
  //   UNKNOWN        — itemId not in catalog
  //   NOT_OWNED      — user doesn't own this cosmetic
  //   NOT_EQUIPPABLE — item is not a cosmetic kind (frame / name color)
  string error_code = 2;
}

message ConsumeRerollRequest {
  string room_id  = 1;
  string round_id = 2;
}

message ConsumeRerollResponse {
  bool  success           = 1;
  int32 charges_remaining = 2;
  // Empty on success. Domain error code: NO_CHARGES — user has zero
  // rerollCharges, so the spend was rejected without mutating state.
  string error_code       = 3;
}

// ---------------------------------------------------------------------------
// Phase 3 (4.4): Friends & Challenges
// ---------------------------------------------------------------------------

message SendFriendRequestRequest {
  // Exactly one of these must be set. target_username is the friendly path
  // (Add by name); target_referral_code is the share-link path.
  string target_username       = 1;
  string target_referral_code  = 2;
}

message SendFriendRequestResponse {
  bool   success    = 1;
  string request_id = 2;
  // Empty on success. Domain error codes:
  //   USER_NOT_FOUND     — username/code didn't resolve
  //   ALREADY_FRIENDS    — relationship already accepted
  //   ALREADY_PENDING    — outbound request already pending
  //   SELF               — caller tried to friend themselves
  //   INVALID_ARGUMENT   — both or neither identifier set
  string error_code = 3;
}

message FriendRequest {
  string id              = 1;
  string from_user_id    = 2;
  string from_username   = 3;
  string to_user_id      = 4;
  string to_username     = 5;
  string status          = 6; // "pending" | "accepted" | "rejected"
  int64  created_at_ms   = 7;
  int64  responded_at_ms = 8;
}

message RespondToFriendRequestRequest {
  string request_id = 1;
  bool   accept     = 2;
}

message RespondToFriendRequestResponse {
  bool   success    = 1;
  // Domain error codes: NOT_FOUND, NOT_RECIPIENT, ALREADY_RESPONDED.
  string error_code = 2;
}

message Friend {
  string user_id     = 1;
  string username    = 2;
  bool   online      = 3;
  int64  friended_at_ms = 4;
}

message GetFriendsListRequest {}

message GetFriendsListResponse {
  repeated Friend friends = 1;
}

message GetFriendRequestsRequest {}

message GetFriendRequestsResponse {
  // Incoming pending requests only — outgoing requests aren't surfaced
  // here in v1 because they're known to the sender from
  // SendFriendRequestResponse and don't need a separate listing screen.
  repeated FriendRequest incoming = 1;
}

message HeartbeatRequest {}

message HeartbeatResponse {
  bool success = 1;
}

message ChallengeFriendRequest {
  string friend_user_id = 1;
}

message ChallengeFriendResponse {
  bool   success    = 1;
  string room_id    = 2;
  // Empty on success. Domain error codes:
  //   NOT_FRIENDS         — caller and target are not accepted friends
  //   FRIEND_OFFLINE      — target's presence TTL expired (best-effort hint)
  //   THROTTLED           — caller already challenged this friend recently
  string error_code = 3;
}
