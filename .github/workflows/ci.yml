name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      # GHA `services.<id>.options` only forwards `docker create` flags, so
      # there's no way to pass `--replSet rs0` (a CMD arg to `mongod`) through
      # that block. Run mongo manually as a replica set instead — the ledger
      # tests rely on multi-document transactions, which standalone mongo
      # doesn't support.
      - name: Start Mongo rs0
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:6 --replSet rs0 --bind_ip_all
          ready=false
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q '^1$'; then
              ready=true; break
            fi
            sleep 2
          done
          [ "$ready" = "true" ] || { echo "mongod never accepted connections" >&2; docker logs mongo >&2 || true; exit 1; }
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          primary=false
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q '^true$'; then
              primary=true; break
            fi
            sleep 2
          done
          [ "$primary" = "true" ] || { echo "rs0 never reached PRIMARY" >&2; docker logs mongo >&2 || true; exit 1; }
      - run: go mod download
      - run: make vet
      - run: make lint
      - run: make test
        env:
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.x', channel: stable }
      - run: cd flutter && flutter pub get
      - run: cd flutter && flutter analyze --no-fatal-warnings
      - run: cd flutter && flutter test
