name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      # GHA `services.<id>.options` only forwards `docker create` flags, so
      # there's no way to pass `--replSet rs0` (a CMD arg to `mongod`) through
      # that block. Run mongo manually as a replica set instead — the ledger
      # tests rely on multi-document transactions, which standalone mongo
      # doesn't support.
      - name: Start Mongo rs0
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:6 --replSet rs0 --bind_ip_all
          ready=false
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q '^1$'; then
              ready=true; break
            fi
            sleep 2
          done
          [ "$ready" = "true" ] || { echo "mongod never accepted connections" >&2; docker logs mongo >&2 || true; exit 1; }
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          primary=false
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q '^true$'; then
              primary=true; break
            fi
            sleep 2
          done
          [ "$primary" = "true" ] || { echo "rs0 never reached PRIMARY" >&2; docker logs mongo >&2 || true; exit 1; }
      - run: go mod download
      - run: make vet
      - run: make lint
      - run: make test
        env:
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', channel: stable }
      - run: cd flutter && flutter pub get
      - run: cd flutter && flutter analyze --no-fatal-warnings
      - run: cd flutter && flutter test

  # §4.9 integration job. Boots the full docker-compose stack and runs the
  # `//go:build integration` e2e suite against the real services. Kept in
  # its own job so the fast unit/Flutter feedback loop above isn't held
  # back by the ~3 min stack-up + tear-down cost.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Write CI .env
        # docker-compose.yml uses `${JWT_SECRET:?...}` (and similar) for
        # services that require values at startup. Compose interpolates
        # these on EVERY `docker compose` invocation — `up`, `ps`,
        # `logs`, `down` — so a step-scoped env block isn't enough:
        # subsequent steps would re-interpolate against an unset value
        # and fail. Writing a real .env at the workspace root makes the
        # values available to every compose call in this job.
        # Placeholder values are fine: the e2e suite never exercises
        # Google sign-in or Razorpay capture; pkg/config.MustRequired
        # only refuses empty values.
        run: |
          cat > .env <<'EOF'
          JWT_SECRET=ci-e2e-jwt-secret-not-for-prod
          GOOGLE_CLIENT_ID=000000000000-placeholder.apps.googleusercontent.com
          RAZORPAY_KEY_ID=rzp_test_placeholder
          RAZORPAY_KEY_SECRET=placeholder
          RAZORPAY_WEBHOOK_SECRET=placeholder
          RESEND_API_KEY=
          EOF

      - name: Boot docker-compose stack
        run: docker compose up -d --build

      - name: Wait for gRPC ports
        run: |
          # Each Go service binds its gRPC port AFTER its dep checks
          # (mongo / redis / rabbitmq) succeed, so a port-up is a
          # stronger readiness signal than `docker compose ps`. Poll
          # every 2s for up to 90s — locally cold-start is ~30s.
          ports="50051 50052 50053 50054 50055"
          ready=false
          for i in $(seq 1 45); do
            ok=true
            for p in $ports; do
              if ! nc -z localhost "$p" 2>/dev/null; then
                ok=false; break
              fi
            done
            if [ "$ok" = "true" ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "::error::services never bound their gRPC ports"
            docker compose ps
            exit 1
          fi
          echo "all gRPC ports up"

      - name: Run integration tests
        run: go test -tags integration -v -timeout 5m ./test/e2e/...

      - name: Capture logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose ps > logs/ps.txt || true
          for svc in auth matchmaking quiz scoring payment notification mongo redis rabbitmq seed; do
            docker compose logs --no-color --tail 500 "$svc" > "logs/$svc.log" 2>&1 || true
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: logs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
